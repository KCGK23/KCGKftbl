name: Update PJDYFL League Table

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-league-table:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install parser
        run: pip install beautifulsoup4

      - name: Fetch and parse correct PJDYFL Division 3 table
        run: |
          python - <<'PY'
          import urllib.request
          import json
          import re
          import html
          from datetime import datetime, timezone
          from bs4 import BeautifulSoup

          URL = "https://www.pjdyfl.co.uk/leaguetablefeed/1058"
          OUTPUT = "league-table.json"

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 Chrome/120 Safari/537.36"
                  )
              }
          )

          print("Fetching PJDYFL league table...")

          with urllib.request.urlopen(request, timeout=30) as response:
              content = response.read().decode("utf-8", errors="ignore")

          print(f"HTTP status: {response.status}")
          print(f"Downloaded: {len(content):,} characters")

          if response.status != 200:
              raise Exception(f"Unexpected HTTP status: {response.status}")

          soup = BeautifulSoup(content, "html.parser")

          # EXACT section we want.
          target_text = "PJDYFL 15s (2011s) Division 3 25/26"

          target = None

          for element in soup.find_all(
              ["h1", "h2", "h3", "h4", "h5", "h6", "div", "p", "b", "strong"]
          ):
              text = element.get_text(" ", strip=True)

              if target_text.lower() in text.lower():
                  target = element
                  print("Found correct Division 3 heading:")
                  print(text)
                  break

          if target is None:
              raise Exception(
                  "Could not find the exact 2011s Division 3 section."
              )

          # Find the first table following the correct heading.
          selected_table = None

          for element in target.find_all_next("table"):
              selected_table = element
              break

          if selected_table is None:
              raise Exception(
                  "Found the Division 3 heading but could not find its table."
              )

          print("Found table underneath the correct Division 3 heading.")

          rows = selected_table.find_all("tr")

          teams = []

          for row in rows:
              cells = row.find_all(["th", "td"])

              values = [
                  cell.get_text(" ", strip=True)
                  for cell in cells
              ]

              if not values:
                  continue

              print("ROW:", values)

              # Header row.
              if "Club" in values:
                  continue

              # Expected:
              # Position | Club | P | W | D | L | F | A | GD | Pts
              if len(values) < 10:
                  continue

              position_text = values[0]
              club = values[1]

              position_match = re.search(r"\d+", position_text)

              if not position_match:
                  continue

              position = int(position_match.group())

              stats = []

              for value in values[2:10]:
                  match = re.search(r"-?\d+", value)

                  if not match:
                      stats = []
                      break

                  stats.append(int(match.group()))

              if len(stats) != 8:
                  continue

              played, won, drawn, lost, goals_for, goals_against, gd, points = stats

              teams.append({
                  "position": position,
                  "club": club,
                  "played": played,
                  "won": won,
                  "drawn": drawn,
                  "lost": lost,
                  "goalsFor": goals_for,
                  "goalsAgainst": goals_against,
                  "goalDifference": gd,
                  "points": points
              })

          if len(teams) != 12:
              raise Exception(
                  f"Expected exactly 12 Division 3 teams, "
                  f"but found {len(teams)}."
              )

          teams.sort(key=lambda team: team["position"])

          # Extra safety check using the exact teams from the official table.
          expected_teams = [
              "Park Sports Project (2011)",
              "Linwood Rangers YC (2011)",
              "Giffnock SC Black (2011)",
              "Houston United FC (2011)",
              "Vale of Leven FC (2011)",
              "JSCC 2011",
              "Ardencaple Football Club (2011)",
              "Port Glasgow Juniors C S C (2011)",
              "Erskine Youth F C (Utd) (2011)",
              "West End BC 2011's",
              "Renfrew Football Club Blue (2011)",
              "Baljaffray FC (2011)"
          ]

          actual_teams = [team["club"] for team in teams]

          if actual_teams != expected_teams:
              print("Expected teams:")
              for team in expected_teams:
                  print(" -", team)

              print("")
              print("Actual teams:")
              for team in actual_teams:
                  print(" -", team)

              raise Exception(
                  "The extracted teams do not match the expected "
                  "2011s Division 3 teams. Refusing to update the JSON."
              )

          data = {
              "source": URL,
              "league": "PJDYFL 15s (2011s) Division 3 25/26",
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "teams": teams
          }

          with open(OUTPUT, "w", encoding="utf-8") as f:
              json.dump(
                  data,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("======================================")
          print("SUCCESS")
          print("Correct 2011s Division 3 table found")
          print(f"Teams: {len(teams)}")
          print("======================================")

          for team in teams:
              print(
                  f"{team['position']}. "
                  f"{team['club']} | "
                  f"P {team['played']} | "
                  f"W {team['won']} | "
                  f"D {team['drawn']} | "
                  f"L {team['lost']} | "
                  f"F {team['goalsFor']} | "
                  f"A {team['goalsAgainst']} | "
                  f"GD {team['goalDifference']} | "
                  f"Pts {team['points']}"
              )
          PY

      - name: Commit updated league table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add league-table.json

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update PJDYFL 2011s Division 3 table"
            git push
          fi
