name: Update My PJDYFL League Table

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-league-table:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install parser
        run: pip install beautifulsoup4

      - name: Find my team's current league table
        run: |
          python - <<'PY'
          import urllib.request
          import json
          import re
          from datetime import datetime, timezone
          from bs4 import BeautifulSoup

          URL = "https://www.pjdyfl.co.uk/leaguetablefeed/1058"
          OUTPUT = "data/league-table.json"
          # ============================================================
          # YOUR TEAM
          # ============================================================
          #
          # This is deliberately the FULL club name.
          # Do not change this to just "Renfrew".
          #
          TARGET_CLUB = "Renfrew Football Club Blue (2011)"

          def normalise(text):
              """Make comparisons tolerant of spaces/capitalisation."""
              text = text.replace("\xa0", " ")
              text = re.sub(r"\s+", " ", text)
              return text.strip().casefold()

          target_normalised = normalise(TARGET_CLUB)

          # ============================================================
          # DOWNLOAD PJDYFL PAGE
          # ============================================================

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 Chrome/120 Safari/537.36"
                  )
              }
          )

          print("Fetching PJDYFL league tables...")

          with urllib.request.urlopen(request, timeout=30) as response:
              status = response.status
              content = response.read().decode(
                  "utf-8",
                  errors="ignore"
              )

          print(f"HTTP status: {status}")
          print(f"Downloaded: {len(content):,} characters")

          if status != 200:
              raise Exception(
                  f"PJDYFL returned HTTP status {status}"
              )

          # Save the downloaded page for debugging if ever needed.
          with open(
              "pjdyfl-page.html",
              "w",
              encoding="utf-8"
          ) as f:
              f.write(content)

          soup = BeautifulSoup(
              content,
              "html.parser"
          )

          tables = soup.find_all("table")

          print(f"Found {len(tables)} tables on the page.")

          # ============================================================
          # FIND THE TABLE CONTAINING THE EXACT CLUB
          # ============================================================

          selected_table = None
          selected_row = None
          selected_club_name = None

          for table_number, table in enumerate(tables, start=1):

              rows = table.find_all("tr")

              for row in rows:

                  cells = row.find_all(
                      ["th", "td"]
                  )

                  values = [
                      cell.get_text(
                          " ",
                          strip=True
                      )
                      for cell in cells
                  ]

                  if not values:
                      continue

                  # Look at the cells individually.
                  #
                  # This is important because we do NOT want:
                  #
                  # "Renfrew"
                  #
                  # or:
                  #
                  # "Renfrew 2011s"
                  #
                  # accidentally matching our team.
                  for value in values:

                      if normalise(value) == target_normalised:

                          selected_table = table
                          selected_row = row
                          selected_club_name = value

                          print("")
                          print("======================================")
                          print("TARGET TEAM FOUND")
                          print("======================================")
                          print(
                              f"Table number: {table_number}"
                          )
                          print(
                              f"Club: {value}"
                          )
                          print("")

                          break

                  if selected_table is not None:
                      break

              if selected_table is not None:
                  break

          if selected_table is None:
              raise Exception(
                  "Could not find the exact club "
                  f"'{TARGET_CLUB}' in any PJDYFL league table."
              )

          # ============================================================
          # FIND THE NAME OF THE DIVISION / LEAGUE
          # ============================================================

          league_name = "PJDYFL League Table"

          # First try captions.
          caption = selected_table.find("caption")

          if caption:
              caption_text = caption.get_text(
                  " ",
                  strip=True
              )

              if caption_text:
                  league_name = caption_text

          # If there is no caption, look backwards through nearby
          # headings/text for something describing this table.
          if league_name == "PJDYFL League Table":

              previous_elements = []

              for element in selected_table.find_all_previous(
                  ["h1", "h2", "h3", "h4", "h5", "h6",
                   "p", "div", "strong", "b"],
                  limit=30
              ):
                  text = element.get_text(
                      " ",
                      strip=True
                  )

                  text = re.sub(
                      r"\s+",
                      " ",
                      text
                  ).strip()

                  if not text:
                      continue

                  lower = text.casefold()

                  # Look for something that appears to describe a
                  # league/division rather than a generic page element.
                  if (
                      "division" in lower
                      or "league" in lower
                      or "2011" in lower
                  ):
                      previous_elements.append(text)

              if previous_elements:
                  league_name = previous_elements[0]

          # ============================================================
          # EXTRACT THE SELECTED TABLE
          # ============================================================

          rows = selected_table.find_all("tr")

          teams = []

          for row in rows:

              cells = row.find_all(
                  ["th", "td"]
              )

              values = [
                  cell.get_text(
                      " ",
                      strip=True
                  )
                  for cell in cells
              ]

              if not values:
                  continue

              print("TABLE ROW:", values)

              # Ignore headings/header rows.
              joined = " ".join(
                  values
              ).casefold()

              if (
                  "club" in joined
                  and (
                      "pts" in joined
                      or "points" in joined
                  )
              ):
                  continue

              # Expected:
              #
              # Position | Club | P | W | D | L | F | A | GD | Pts
              #
              if len(values) < 9:
                  continue

              # Find the position.
              position = None
              position_index = None

              for index, value in enumerate(values):

                  match = re.fullmatch(
                      r"\s*\d+\s*",
                      value
                  )

                  if match:
                      position = int(
                          value.strip()
                      )
                      position_index = index
                      break

              if position is None:
                  continue

              # The club should normally be immediately after position.
              if position_index + 1 >= len(values):
                  continue

              club = values[
                  position_index + 1
              ].strip()

              if not club:
                  continue

              # Statistics come after the club.
              stat_values = values[
                  position_index + 2:
              ]

              if len(stat_values) < 8:
                  continue

              stats = []

              for value in stat_values[:8]:

                  # Handle things such as:
                  # +12
                  # -5
                  # 12
                  match = re.search(
                      r"-?\d+",
                      value
                  )

                  if not match:
                      stats = []
                      break

                  stats.append(
                      int(match.group())
                  )

              if len(stats) != 8:
                  continue

              (
                  played,
                  won,
                  drawn,
                  lost,
                  goals_for,
                  goals_against,
                  goal_difference,
                  points
              ) = stats

              teams.append({
                  "position": position,
                  "club": club,
                  "played": played,
                  "won": won,
                  "drawn": drawn,
                  "lost": lost,
                  "goalsFor": goals_for,
                  "goalsAgainst": goals_against,
                  "goalDifference": goal_difference,
                  "points": points
              })

          # ============================================================
          # SAFETY CHECK
          # ============================================================

          if not teams:
              raise Exception(
                  "The correct table was found, "
                  "but no team rows could be extracted."
              )

          # Make sure our team actually exists in the extracted table.
          extracted_clubs = [
              normalise(team["club"])
              for team in teams
          ]

          if target_normalised not in extracted_clubs:

              print("")
              print("Extracted clubs:")

              for team in teams:
                  print(
                      f"- {team['club']}"
                  )

              raise Exception(
                  "Safety check failed: "
                  "the extracted table does not contain "
                  f"'{TARGET_CLUB}'."
              )

          teams.sort(
              key=lambda team: team["position"]
          )

          # ============================================================
          # CREATE JSON
          # ============================================================

          data = {
              "source": URL,
              "league": league_name,
              "updatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),
              "myTeam": TARGET_CLUB,
              "teams": teams
          }

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          # ============================================================
          # DISPLAY RESULT
          # ============================================================

          print("")
          print("======================================")
          print("SUCCESS")
          print("======================================")
          print(
              f"League/table found: {league_name}"
          )
          print(
              f"Teams found: {len(teams)}"
          )
          print(
              f"My team: {TARGET_CLUB}"
          )
          print("")

          for team in teams:

              marker = ""

              if normalise(
                  team["club"]
              ) == target_normalised:
                  marker = "  <-- MY TEAM"

              print(
                  f"{team['position']}. "
                  f"{team['club']} | "
                  f"P {team['played']} | "
                  f"W {team['won']} | "
                  f"D {team['drawn']} | "
                  f"L {team['lost']} | "
                  f"F {team['goalsFor']} | "
                  f"A {team['goalsAgainst']} | "
                  f"GD {team['goalDifference']} | "
                  f"Pts {team['points']}"
                  f"{marker}"
              )

          print("")
          print(
              "The updater will automatically follow "
              "this team if it moves to another division."
          )
          PY

      - name: Commit updated league table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/league-table.json pjdyfl-page.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update my PJDYFL league table"
            git push
          fi
