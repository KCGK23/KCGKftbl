name: Test PJDYFL Feed

on:
  workflow_dispatch:

jobs:
  test-pjdyfl:
    runs-on: ubuntu-latest

    steps:
      - name: Test PJDYFL league table
        run: |
          python - <<'PY'
          import urllib.request

          url = "https://www.pjdyfl.co.uk/leaguetablefeed/1058"

          print(f"Testing: {url}")

          request = urllib.request.Request(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 (compatible; KCGK League Table Test)"
              }
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status = response.status
                  content = response.read().decode("utf-8", errors="ignore")

              print(f"HTTP status: {status}")
              print(f"Downloaded: {len(content):,} characters")

              if status != 200:
                  raise Exception(f"Unexpected HTTP status: {status}")

              keywords = [
                  "2011",
                  "Division 3",
                  "Club",
                  "Pts"
              ]

              print("\nChecking for league-table content:")

              for keyword in keywords:
                  if keyword.lower() in content.lower():
                      print(f"✅ Found: {keyword}")
                  else:
                      print(f"❌ Not found: {keyword}")

              if "Division 3" not in content:
                  raise Exception(
                      "The page was reachable, but the expected Division 3 "
                      "league-table content was not found."
                  )

              print("\n✅ SUCCESS: GitHub Actions can retrieve the PJDYFL feed.")

          except Exception as error:
              print(f"\n❌ TEST FAILED: {error}")
              raise
          PY
