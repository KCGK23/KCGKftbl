name: Update PJDYFL League Table

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-league-table:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install parser
        run: pip install beautifulsoup4

      - name: Fetch and parse PJDYFL table
        run: |
          python - <<'PY'
          import urllib.request
          import json
          import re
          from datetime import datetime, timezone
          from bs4 import BeautifulSoup

          URL = "https://www.pjdyfl.co.uk/leaguetablefeed/1058"
          OUTPUT = "league-table.json"

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 Chrome/120 Safari/537.36"
                  )
              }
          )

          print("Fetching PJDYFL...")
          
          with urllib.request.urlopen(request, timeout=30) as response:
              content = response.read().decode("utf-8", errors="ignore")

          print(f"Downloaded {len(content):,} characters")

          # Save a copy so the exact HTML can be inspected if parsing fails.
          with open("pjdyfl-page.html", "w", encoding="utf-8") as f:
              f.write(content)

          soup = BeautifulSoup(content, "html.parser")

          # Find tables on the page.
          tables = soup.find_all("table")

          print(f"Found {len(tables)} HTML tables.")

          selected_table = None

          # Look for the table containing the expected league columns.
          for table in tables:
              text = table.get_text(" ", strip=True).lower()

              if (
                  "club" in text
                  and "pts" in text
                  and "played" in text
              ):
                  selected_table = table
                  print("Found a likely league table.")
                  break

          # Some versions of the page may use abbreviated headings.
          if selected_table is None:
              for table in tables:
                  text = table.get_text(" ", strip=True).lower()

                  if (
                      "club" in text
                      and "pts" in text
                      and "gd" in text
                  ):
                      selected_table = table
                      print("Found a league table using abbreviated headings.")
                      break

          if selected_table is None:
              raise Exception(
                  "Could not find a league table in the PJDYFL HTML."
              )

          rows = selected_table.find_all("tr")

          teams = []

          for row in rows:
              cells = row.find_all(["th", "td"])

              values = [
                  cell.get_text(" ", strip=True)
                  for cell in cells
              ]

              if not values:
                  continue

              print("ROW:", values)

              # Ignore header rows.
              joined = " ".join(values).lower()

              if "club" in joined and (
                  "pts" in joined or "points" in joined
              ):
                  continue

              # We expect:
              # Position | Club | P | W | D | L | F | A | GD | Pts
              #
              # Some versions may omit the position, so support both.

              if len(values) >= 10:
                  position = values[0]
                  club = values[1]
                  stats = values[2:10]

              elif len(values) >= 9:
                  position = str(len(teams) + 1)
                  club = values[0]
                  stats = values[1:9]

              else:
                  continue

              # Clean position.
              position_match = re.search(r"\d+", position)

              if not position_match:
                  continue

              position = int(position_match.group())

              # Clean numeric values.
              cleaned_stats = []

              for value in stats:
                  value = value.replace(",", "").strip()

                  match = re.search(r"-?\d+", value)

                  if not match:
                      cleaned_stats = []
                      break

                  cleaned_stats.append(int(match.group()))

              if len(cleaned_stats) != 8:
                  continue

              played, won, drawn, lost, goals_for, goals_against, gd, points = cleaned_stats

              # Make sure this actually looks like a football league row.
              if not club:
                  continue

              teams.append({
                  "position": position,
                  "club": club,
                  "played": played,
                  "won": won,
                  "drawn": drawn,
                  "lost": lost,
                  "goalsFor": goals_for,
                  "goalsAgainst": goals_against,
                  "goalDifference": gd,
                  "points": points
              })

          if not teams:
              raise Exception(
                  "No valid team rows were found."
              )

          # Sort by official table position.
          teams.sort(key=lambda team: team["position"])

          data = {
              "source": URL,
              "league": "PJDYFL 2011s Division 3",
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "teams": teams
          }

          with open(OUTPUT, "w", encoding="utf-8") as f:
              json.dump(
                  data,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          print("")
          print("======================================")
          print("SUCCESS")
          print("======================================")
          print(f"Teams found: {len(teams)}")
          print("")

          for team in teams:
              print(
                  f"{team['position']}. "
                  f"{team['club']} | "
                  f"P {team['played']} | "
                  f"W {team['won']} | "
                  f"D {team['drawn']} | "
                  f"L {team['lost']} | "
                  f"F {team['goalsFor']} | "
                  f"A {team['goalsAgainst']} | "
                  f"GD {team['goalDifference']} | "
                  f"Pts {team['points']}"
              )
          PY

      - name: Commit updated table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add league-table.json pjdyfl-page.html

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update PJDYFL league table"
            git push
          fi
