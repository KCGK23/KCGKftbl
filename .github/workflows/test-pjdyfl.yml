name: Update PJDYFL League Table

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-league-table:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install parser
        run: pip install beautifulsoup4

      - name: Fetch and parse current PJDYFL Division 3 table
        run: |
          python - <<'PY'
          import urllib.request
          import json
          import re
          from datetime import datetime, timezone
          from bs4 import BeautifulSoup

          URL = "https://www.pjdyfl.co.uk/leaguetablefeed/1058"
          OUTPUT = "league-table.json"

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": (
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 Chrome/120 Safari/537.36"
                  )
              }
          )

          print("Fetching PJDYFL...")

          with urllib.request.urlopen(request, timeout=30) as response:
              status = response.status
              content = response.read().decode("utf-8", errors="ignore")

          print(f"HTTP status: {status}")
          print(f"Downloaded: {len(content):,} characters")

          if status != 200:
              raise Exception(f"Unexpected HTTP status: {status}")

          soup = BeautifulSoup(content, "html.parser")

          # ------------------------------------------------------------
          # FIND THE CURRENT 2011s DIVISION 3 SECTION
          # ------------------------------------------------------------
          #
          # Do NOT hard-code "25/26".
          #
          # We look for a heading containing:
          #
          # PJDYFL
          # 2011s
          # Division 3
          #
          # This allows the season/year to change automatically.
          # ------------------------------------------------------------

          target_heading = None

          for element in soup.find_all(
              ["h1", "h2", "h3", "h4", "h5", "h6",
               "div", "p", "b", "strong", "span"]
          ):
              text = element.get_text(" ", strip=True)

              normalised = re.sub(r"\s+", " ", text).lower()

              if (
                  "pjdyfl" in normalised
                  and "2011" in normalised
                  and "division 3" in normalised
              ):
                  target_heading = element

                  print("")
                  print("FOUND TARGET SECTION:")
                  print(text)
                  print("")

                  break

          if target_heading is None:
              raise Exception(
                  "Could not find the current PJDYFL 2011s Division 3 section."
              )

          # ------------------------------------------------------------
          # FIND THE TABLE BELONGING TO THAT SECTION
          # ------------------------------------------------------------

          selected_table = None

          for table in target_heading.find_all_next("table"):
              selected_table = table
              break

          if selected_table is None:
              raise Exception(
                  "Found the 2011s Division 3 heading, "
                  "but could not find its league table."
              )

          print("Found the league table.")

          # ------------------------------------------------------------
          # EXTRACT TABLE ROWS
          # ------------------------------------------------------------

          rows = selected_table.find_all("tr")

          teams = []

          for row in rows:
              cells = row.find_all(["th", "td"])

              values = [
                  cell.get_text(" ", strip=True)
                  for cell in cells
              ]

              if not values:
                  continue

              print("ROW:", values)

              # Skip the header.
              joined = " ".join(values).lower()

              if (
                  "club" in joined
                  and ("pts" in joined or "points" in joined)
              ):
                  continue

              # Expected structure:
              #
              # Position | Club | P | W | D | L | F | A | GD | Pts
              #
              # We deliberately do NOT require exactly 12 teams.

              if len(values) < 10:
                  continue

              position_text = values[0]
              club = values[1]

              position_match = re.search(
                  r"\d+",
                  position_text
              )

              if not position_match:
                  continue

              position = int(position_match.group())

              stats = []

              for value in values[2:10]:
                  match = re.search(
                      r"-?\d+",
                      value
                  )

                  if not match:
                      stats = []
                      break

                  stats.append(
                      int(match.group())
                  )

              if len(stats) != 8:
                  continue

              (
                  played,
                  won,
                  drawn,
                  lost,
                  goals_for,
                  goals_against,
                  goal_difference,
                  points
              ) = stats

              if not club:
                  continue

              teams.append({
                  "position": position,
                  "club": club,
                  "played": played,
                  "won": won,
                  "drawn": drawn,
                  "lost": lost,
                  "goalsFor": goals_for,
                  "goalsAgainst": goals_against,
                  "goalDifference": goal_difference,
                  "points": points
              })

          # ------------------------------------------------------------
          # SAFETY CHECK
          # ------------------------------------------------------------
          #
          # We don't care whether Division 3 has 10, 11, 12, 13, etc.
          # teams.
          #
          # But we DO require at least one valid team.
          # ------------------------------------------------------------

          if not teams:
              raise Exception(
                  "No valid teams were extracted from the "
                  "2011s Division 3 table."
              )

          teams.sort(
              key=lambda team: team["position"]
          )

          # ------------------------------------------------------------
          # CREATE JSON
          # ------------------------------------------------------------

          data = {
              "source": URL,
              "league": "PJDYFL 2011s Division 3",
              "section": target_heading.get_text(
                  " ",
                  strip=True
              ),
              "updatedAt": datetime.now(
                  timezone.utc
              ).isoformat(),
              "highlightClub": "Renfrew Football Club Blue (2011)",
              "teams": teams
          }

          with open(
              OUTPUT,
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  indent=2,
                  ensure_ascii=False
              )

          # ------------------------------------------------------------
          # OUTPUT RESULTS
          # ------------------------------------------------------------

          print("")
          print("========================================")
          print("SUCCESS")
          print("========================================")
          print(
              f"Division 3 teams found: {len(teams)}"
          )
          print("")

          for team in teams:
              print(
                  f"{team['position']}. "
                  f"{team['club']} | "
                  f"P {team['played']} | "
                  f"W {team['won']} | "
                  f"D {team['drawn']} | "
                  f"L {team['lost']} | "
                  f"F {team['goalsFor']} | "
                  f"A {team['goalsAgainst']} | "
                  f"GD {team['goalDifference']} | "
                  f"Pts {team['points']}"
              )

          print("")
          print(
              "KCGK highlight team:",
              data["highlightClub"]
          )
          PY

      - name: Commit updated league table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add league-table.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update PJDYFL 2011s Division 3 table"
            git push
          fi
