<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Fixtures | KCGK</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="goalkeeper"><img class="team-logo" src="../assets/images/team-logo.png" alt="Renfrew Juniors logo"><h1>Fixtures</h1></header><div data-site-navigation></div><main><section class="fixtures-card"><div class="fixtures-header"><h2>Upcoming Fixtures</h2><p>Fixtures are shared with every visitor.</p></div><div class="fixture-list-card"><div class="fixture-tabs"><button class="fixture-tab active" data-filter="upcoming">Upcoming</button><button class="fixture-tab" data-filter="all">All</button><button class="fixture-tab" data-filter="league">League</button><button class="fixture-tab" data-filter="other">Cup/Friendly</button></div><ul id="fixtureList"><li class="fixture-empty">Loading fixtures…</li></ul></div><section class="tournament-list-card"><div class="tournament-list-heading"><h3>Tournaments</h3><span>Match days and cup competitions</span></div><div id="tournamentList" class="tournament-list"></div></section></section><div id="tournamentModal" class="tournament-modal hidden" role="dialog" aria-modal="true"><div class="tournament-modal-backdrop" data-close-tournament-modal></div><section class="tournament-modal-content"><button id="closeTournamentModal" class="tournament-modal-close" type="button">×</button><p class="tournament-kicker">🏆 TOURNAMENT</p><h2 id="tournamentModalTitle">Tournament</h2><p id="tournamentModalMeta" class="tournament-modal-meta"></p><div id="tournamentModalAdmin" class="tournament-modal-admin hidden"><button id="addTournamentMatchInlineButton" type="button" class="secondary-button">+ Add Match</button><div id="tournamentInlineMatchEditor" class="tournament-inline-match-editor hidden"></div></div><div id="tournamentModalMatches" class="tournament-modal-matches"></div></section></div></main><script type="module">import { mountNavigation } from '../js/navigation.js';import { loadFixtures,renderFixtures } from '../js/fixtures.js';import { loadTournaments,closeTournamentModal } from '../js/tournaments.js';mountNavigation('Fixtures');let filter='upcoming';const list=document.querySelector('#fixtureList');const refresh=async()=>{const {fixtures}=await loadFixtures();renderFixtures(list,fixtures,{filter});};document.querySelectorAll('[data-filter]').forEach(button=>button.onclick=()=>{document.querySelectorAll('[data-filter]').forEach(x=>x.classList.remove('active'));button.classList.add('active');filter=button.dataset.filter;refresh();});document.querySelector('#closeTournamentModal').onclick=closeTournamentModal;document.querySelector('[data-close-tournament-modal]').onclick=closeTournamentModal;refresh();loadTournaments();</script></body></html>
