<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin | KCGK</title><link rel="stylesheet" href="../css/style.css"></head><body><header class="goalkeeper"><img class="team-logo" src="../assets/images/team-logo.png" alt="Renfrew Juniors logo"><h1>Admin Panel</h1></header><div data-site-navigation></div><main><section class="fixtures-card"><div class="fixture-access admin-section"><h3>Admin Login</h3><div class="fixture-access-row"><label>Email<input id="fixtureEmail" type="email" autocomplete="username"></label><label>Password<input id="fixturePassword" type="password" autocomplete="current-password"></label></div><div class="fixture-access-buttons"><button id="unlockFixturesButton" class="primary-button" type="button">Unlock</button><button id="logoutButton" class="secondary-button hidden" type="button">Logout</button></div><p id="fixtureAccessMessage" class="fixture-message"></p></div><form id="fixtureForm" data-admin-only class="fixture-form admin-section hidden"><h3>Add Fixture</h3><div class="fixture-row"><label>Date<input id="fixtureDate" type="date" required></label><label>Opponent<input id="fixtureOpponent" required></label></div><div class="fixture-row"><label>Competition<input id="fixtureComp"></label><label>Location<input id="fixtureLocation"></label></div><button class="primary-button">Add Fixture</button></form><div data-admin-only class="fixture-score-editor admin-section hidden"><h3>Post Fixture Score</h3><select id="scoreFixtureSelect"><option value="">Select fixture</option></select><div class="fixture-row"><label>Our score<input id="scoreHome" type="number" min="0"></label><label>Opponent score<input id="scoreAway" type="number" min="0"></label></div><button id="saveScoreButton" class="primary-button" type="button">Save Score</button><label class="motm-toggle"><input id="manOfTheMatch" type="checkbox"> Man of the Match</label><button id="saveManOfTheMatchButton" class="secondary-button" type="button">Save Man of the Match</button></div><div data-admin-only id="statsEditor" class="admin-section hidden"><h3>Edit Player Stats</h3><div class="fixture-row"><label>Kit Number<input id="editKitNumber" value="23"></label><label>Yellow Cards<input id="editYellowCards" type="number" value="1"></label></div><div class="fixture-row"><label>Red Cards<input id="editRedCards" type="number" value="0"></label><label>Injuries<input id="editInjuries" value="None"></label></div><button id="saveStatsButton" class="primary-button" type="button">Save Stats</button><p id="statsSaveMessage" class="fixture-message"></p></div><section data-admin-only id="tournamentEditor" class="tournament-editor admin-section hidden"><div class="tournament-editor-heading"><div><h3>Tournament Editor</h3><p>Create tournaments and add or update their matches.</p></div><button id="createTournamentButton" class="secondary-button" type="button">+ Create Tournament</button></div><div id="tournamentEditPanel" class="tournament-edit-panel hidden"><input id="editingTournamentId" type="hidden"><div class="fixture-row"><label>Name<input id="tournamentName"></label><label>Date<input id="tournamentDate" type="date"></label></div><label>Location<input id="tournamentLocation"></label><div class="tournament-edit-actions"><button id="addTournamentMatchButton" class="secondary-button" type="button">+ Add Match</button><button id="saveTournamentButton" class="primary-button" type="button">Save Changes</button><button id="cancelTournamentButton" class="secondary-button" type="button">Cancel</button></div><div id="tournamentMatchEditor"></div><p id="tournamentEditorMessage" class="fixture-message"></p></div><div class="tournament-admin-list-wrap"><h4>Existing Tournaments</h4><div id="tournamentAdminList" class="tournament-admin-list"></div></div></section><div class="fixture-list-card"><h3>Fixtures</h3><ul id="fixtureList"></ul></div></section></main><script type="module">import {mountNavigation} from '../js/navigation.js';import {initAdmin} from '../js/admin.js';mountNavigation('Admin');initAdmin();</script></body></html>
